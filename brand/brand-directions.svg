<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1530" role="img" aria-labelledby="title desc">
  <title id="title">everyone — eight logo directions</title>
  <desc id="desc">A comparison sheet of eight colorful, modern wordmark options for the family website.</desc>
  <defs>
    <linearGradient id="spectrum" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#00d4ff"/><stop offset=".48" stop-color="#875bff"/><stop offset="1" stop-color="#ff4fb8"/></linearGradient>
    <linearGradient id="sunrise" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#ff4e9b"/><stop offset=".52" stop-color="#ff7a32"/><stop offset="1" stop-color="#ffd53e"/></linearGradient>
    <linearGradient id="electric" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#00c9a7"/><stop offset=".52" stop-color="#00b8ff"/><stop offset="1" stop-color="#725cff"/></linearGradient>
    <linearGradient id="rainbow" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#ff496c"/><stop offset=".28" stop-color="#ffad32"/><stop offset=".55" stop-color="#b8ed38"/><stop offset=".78" stop-color="#00d7d2"/><stop offset="1" stop-color="#8a62ff"/></linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="7" result="b"/><feComposite in="SourceGraphic" in2="b" operator="over"/></filter>
    <style>
      .ink{fill:#15172b}.sub{fill:#73778b}.card{fill:#fff;stroke:#e6e7ed;stroke-width:1.5}.tag{font:700 12px 'Arial',sans-serif;letter-spacing:2.2px;fill:#85899a}.name{font-family:'Arial',Helvetica,sans-serif}
    </style>
  </defs>
  <rect width="1080" height="1530" fill="#f5f6fa"/>
  <text x="52" y="62" class="tag">BRAND STUDY / 2026</text>
  <text x="52" y="124" class="name ink" font-size="53" font-weight="700" letter-spacing="-2">everyone</text>
  <text x="1025" y="119" text-anchor="end" class="tag">8 DIRECTIONS</text>

  <!-- 01 -->
  <g transform="translate(42 165)"><rect class="card" width="486" height="300" rx="24"/><text x="28" y="39" class="tag">01  /  EVRY1 — LINKED</text>
    <g transform="translate(83 143)" stroke-linecap="round">
      <path d="M-23-17 0 0 23-17M-23 17 0 0 23 17" fill="none" stroke="#17203a" stroke-width="8"/>
      <circle cx="-26" cy="-20" r="18" fill="#ff4e9b"/><circle cx="26" cy="-20" r="18" fill="#00d4ff"/><circle cx="-26" cy="20" r="18" fill="#b8ed38"/><circle cx="26" cy="20" r="18" fill="#ff9b32"/><circle r="12" fill="#fff"/>
    </g>
    <text x="143" y="159" class="name" font-size="52" font-weight="700" letter-spacing="-3.5"><tspan fill="#ff4e9b">e</tspan><tspan fill="#00c9e8">v</tspan><tspan fill="#b8ed38">r</tspan><tspan fill="#ff9b32">y</tspan><tspan fill="#15172b">one</tspan></text>
    <text x="146" y="188" class="name" font-size="15" font-weight="500"><tspan fill="#15172b">two</tspan><tspan fill="#ff4e9b">g</tspan><tspan fill="#00c9e8">t</tspan><tspan fill="#b8ed38">h</tspan><tspan fill="#ff9b32">r</tspan><tspan fill="#73778b"> in one place</tspan></text>
    <text x="28" y="254" class="name sub" font-size="15">Four bright links, one shared center, and a compact tagline.</text>
  </g>
  <!-- 02 -->
  <g transform="translate(552 165)"><rect class="card" width="486" height="300" rx="24"/><text x="28" y="39" class="tag">02  /  EVERYONE — SPECTRUM</text>
    <g transform="translate(75 139)"><path d="M0 0a34 34 0 1 1 22 32" fill="none" stroke="url(#spectrum)" stroke-width="12" stroke-linecap="round"/><path d="M0 0h31" stroke="#15172b" stroke-width="9" stroke-linecap="round"/></g>
    <text x="126" y="161" class="name ink" font-size="51" font-weight="700" letter-spacing="-3.4"><tspan fill="url(#spectrum)">e</tspan>veryone</text>
    <text x="28" y="254" class="name sub" font-size="15">A fast, close-set wordmark with a bright signal “e”.</text>
  </g>
  <!-- 03 -->
  <g transform="translate(42 485)"><rect class="card" width="486" height="300" rx="24"/><text x="28" y="39" class="tag">03  /  EVERYONE — BOLD ONE</text>
    <text x="47" y="163" class="name ink" font-size="58" font-weight="400" letter-spacing="-2.7">every</text><text x="214" y="163" class="name" font-size="58" font-weight="800" letter-spacing="-3" fill="url(#electric)">one</text>
    <path d="M224 183h119" stroke="url(#electric)" stroke-width="5" stroke-linecap="round"/><circle cx="349" cy="183" r="5" fill="#00c9a7"/>
    <text x="28" y="254" class="name sub" font-size="15">“one” carries the emphasis; the underline joins it up.</text>
  </g>
  <!-- 04 -->
  <g transform="translate(552 485)"><rect class="card" width="486" height="300" rx="24"/><text x="28" y="39" class="tag">04  /  EVRY1 — WIDE SIGNAL</text>
    <text x="33" y="159" class="name ink" font-size="48" font-weight="650" letter-spacing="5.2">evry<tspan fill="#ff4e9b" font-weight="800">1</tspan></text>
    <path d="M38 181h126m18 0h86m18 0h149" stroke="url(#spectrum)" stroke-width="3" stroke-linecap="round"/><circle cx="167" cy="181" r="4" fill="#ff4e9b"/><circle cx="298" cy="181" r="4" fill="#00d4ff"/>
    <text x="28" y="254" class="name sub" font-size="15">Airy letter spacing and a bright numeric finish.</text>
  </g>
  <!-- 05 -->
  <g transform="translate(42 805)"><rect class="card" width="486" height="300" rx="24"/><text x="28" y="39" class="tag">05  /  EVERY / ONE — STACKED</text>
    <text x="54" y="127" class="name ink" font-size="44" font-weight="500" letter-spacing="3.5">every</text><text x="54" y="183" class="name" font-size="53" font-weight="800" letter-spacing="-1.5" fill="url(#sunrise)">one</text>
    <path d="M232 95v92" stroke="#e5e8ef" stroke-width="2"/><text x="262" y="139" class="name ink" font-size="18" font-weight="600">Together,</text><text x="262" y="166" class="name sub" font-size="16">in one place.</text>
    <text x="28" y="254" class="name sub" font-size="15">A two-level lockup with vivid emphasis on “one”.</text>
  </g>
  <!-- 06 -->
  <g transform="translate(552 805)"><rect class="card" width="486" height="300" rx="24"/><text x="28" y="39" class="tag">06  /  EVERYONE — RIBBON</text>
    <text x="33" y="158" class="name ink" font-size="57" font-weight="700" letter-spacing="-4.5">everyone</text>
    <path d="M45 176c58 26 121 26 186 0s122-26 210 0" fill="none" stroke="url(#rainbow)" stroke-width="6" stroke-linecap="round"/><circle cx="441" cy="176" r="6" fill="#8a62ff"/>
    <text x="28" y="254" class="name sub" font-size="15">A flowing color ribbon links the tight lettering.</text>
  </g>
  <!-- 07 -->
  <g transform="translate(42 1125)"><rect class="card" width="486" height="300" rx="24"/><text x="28" y="39" class="tag">07  /  EVERYONE — CHROMATIC</text>
    <text x="36" y="161" class="name" font-size="55" font-weight="750" letter-spacing="-2.3"><tspan fill="#ff496c">e</tspan><tspan fill="#ff9638">v</tspan><tspan fill="#d2cf25">e</tspan><tspan fill="#00bd94">r</tspan><tspan fill="#00b8ee">y</tspan><tspan fill="#426cff">o</tspan><tspan fill="#895cff">n</tspan><tspan fill="#e24cbe">e</tspan></text>
    <text x="28" y="254" class="name sub" font-size="15">Every letter gets a color; the shape stays simple.</text>
  </g>
  <!-- 08 -->
  <g transform="translate(552 1125)"><rect class="card" width="486" height="300" rx="24"/><text x="28" y="39" class="tag">08  /  EVERYONE — NEGATIVE SPACE</text>
    <rect x="32" y="89" width="422" height="91" rx="45.5" fill="#171a34"/>
    <text x="59" y="151" class="name" font-size="49" font-weight="650" letter-spacing="-2.3" fill="#fff">everyone</text>
    <circle cx="401" cy="107" r="10" fill="#00d4ff"/><circle cx="427" cy="161" r="9" fill="#ff4e9b"/>
    <path d="M361 134h72" stroke="url(#electric)" stroke-width="3" stroke-linecap="round" opacity=".9"/>
    <text x="28" y="254" class="name sub" font-size="15">A dark capsule lets the bright dots cut through.</text>
  </g>
  <text x="52" y="1490" class="tag">LOWERCASE WORDMARKS  /  COLORFUL, CONNECTED, MADE FOR THE FAMILY</text>
</svg>
